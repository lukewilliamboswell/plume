name: Example screenshots

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@2b0ffc9c556f465759ca81055bb819c7e15624eb
        with:
          cache: 'true'
          cache-workload: screenshots
      - uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@dd30a5dd576973b6e224db70d96e3e12c96bcc95
      - run: blueprint check
      - run: blueprint run screenshots-setup -- --with-deps
      - run: blueprint run screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: plume-screenshots
          path: .screenshots-out/
          include-hidden-files: true
          if-no-files-found: error
