name: Example screenshots

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@e12512e2605608588782edb044dd766137e34869
        with:
          cache: 'true'
          cache-workload: screenshots
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly-new-compiler
          download-method: asset-api
      - run: blueprint check
      - run: blueprint run screenshots-setup -- --with-deps
      - run: blueprint run screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: plume-screenshots
          path: .screenshots-out/
          include-hidden-files: true
          if-no-files-found: error
